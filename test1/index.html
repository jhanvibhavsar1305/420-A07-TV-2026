<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #202938;
    }

    header, main, footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }

    header { padding-bottom: 0; }
    h1 { margin-bottom: 10px; }
    #count { font-weight: bold; }

    #todo-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid #d5dbe5;
      border-radius: 10px;
      padding: 18px;
      overflow-wrap: anywhere;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 18px;
      line-height: 1.4;
    }

    button {
      padding: 10px 12px;
      border: 1px solid #a8b4c7;
      border-radius: 6px;
      background: #eef2ff;
      color: #202938;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #315bc7;
      outline-offset: 3px;
    }

    footer { color: #596579; }

    @media (min-width: 768px) {
      #todo-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My To-Do List</h1>
    <p id="count" aria-live="polite">Waiting for tasks...</p>
  </header>

  <main>
    <p id="status" role="status">Loading...</p>
    <section id="todo-list" aria-label="Tasks"></section>
  </main>

  <footer>
    <p>Click a task's status to mark it complete or incomplete.</p>
  </footer>

  <script>
    const list = document.querySelector("#todo-list");
    const statusMessage = document.querySelector("#status");
    const count = document.querySelector("#count");
    let todos = [];

    function updateCount() {
      const completed = todos.filter(todo => todo.completed).length;
      count.textContent = `${completed} of ${todos.length} completed`;
    }

    function renderTodos() {
      list.replaceChildren();

      todos.forEach(todo => {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = todo.title;

        const button = document.createElement("button");
        button.type = "button";

        function updateButton() {
          button.textContent = todo.completed ? "✅ Completed" : "⬜ Not completed";
          button.setAttribute("aria-pressed", String(todo.completed));
        }

        button.addEventListener("click", () => {
          todo.completed = !todo.completed;
          updateButton();
          updateCount();
        });

        updateButton();
        card.append(title, button);
        list.append(card);
      });

      updateCount();
    }

    async function loadTodos() {
      statusMessage.textContent = "Loading...";

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/todos?_limit=12");

        if (!response.ok) {
          throw new Error("Could not load tasks");
        }

        todos = await response.json();
        renderTodos();
        statusMessage.textContent = "";
      } catch (error) {
        count.textContent = "Tasks unavailable";
        statusMessage.textContent = "Sorry, we couldn't load your tasks. Check your connection and refresh the page.";
      }
    }

    loadTodos();
  </script>
</body>
</html>
